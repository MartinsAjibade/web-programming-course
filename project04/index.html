    <head>

    <body>
        <header>
             <h1>Accounting Data Converter</h1>
        </header>
        <main>
            <p>
                This program essentially converts records from semicolon-delimited
                format into a comma-separated format(CSV).
            </p>
            
            <form>
                <label for="inputtedText">Enter your accounting record: </label>
                <input type="text" id="inputtedText" name="inputtedText" placeholder="Enter...">
                <input type="button" id="switch" value="Convert" 
                onclick="separator(document.getElementById('inputtedText').value)">
            </form>

            <p id="result"></p>
        </main>
        <footer>
             <!--Your footer goes here-->
        </footer>
    </body>
