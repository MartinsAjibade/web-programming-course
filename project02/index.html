<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Temperature Converter</title>
        <meta charset="utf-8"/>
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1>Fahrenheit to Celsius Converter</h1>
        </header>

        <p>
            This program allows you to convert a temperature from Fahrenheit to Celsius. 
            You are first prompted to enter a temperature, which is automatically in Fahrenheit 
            and you have to click the Convert button, which will then give you the equivalent temperature in Celsius.
        </p>

        <script src="script.js"></script>
        
        <form>
            <label for="temp" id="tempLabel">
                Enter the temperature in Fahrenheit:
            </label>            
            <input type="number" id="temp" value="0">
            <input type="button" id="go" value="Convert" onclick="convert();">

            <input type="button" id="switch" value="Switch to Celsius" onclick="switchConversion();">

            <p id="result"></p>
        </form>

        <footer>
             <!--Your footer goes here-->
        </footer>
    </body>
</html>
